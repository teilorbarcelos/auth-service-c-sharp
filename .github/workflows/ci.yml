name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore tests/MageBackend.Tests.csproj

    - name: Build Project
      run: dotnet build src/MageBackend.csproj --configuration Release --no-restore

    - name: Build Tests Project
      run: dotnet build tests/MageBackend.Tests.csproj --configuration Debug --no-restore

    - name: Run Tests with Coverage
      run: dotnet test tests/MageBackend.Tests.csproj -m:1 --configuration Debug --no-restore /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=./tests/coverage.cobertura.xml
